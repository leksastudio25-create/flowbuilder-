function renderStep(){var v='';if(S.step===0)v=stepSetup();if(S.step===1)v=stepStyle();if(S.step===2)v=stepCam();if(S.step===3)v=stepPhase();if(S.step===4)v=stepRef();if(S.step===5)v=stepOut();q('views').innerHTML=v;bindInputs()}
function stepSetup(){return '<div class="card"><div class="cardTitle">'+icon('M12 2v20M2 12h20')+'Mode Proyek</div><div class="chips">'+chip('mode','new_build','New Build')+chip('mode','renovasi','Renovasi')+chip('mode','referensi','Dari Referensi')+'</div></div><div class="card"><div class="cardTitle">'+icon('M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM2 12h20M12 2c3 3 4 7 4 10s-1 7-4 10c-3-3-4-7-4-10s1-7 4-10z')+'Negara & Lokasi</div><div class="two"><div><div class="label">Negara</div><button class="btn" style="width:100%;justify-content:space-between" onclick="countryModal()">'+S.country+' <span>⌄</span></button></div><div><div class="label">Lingkungan</div><select id="location">'+['Tepi Sungai','Pusat Kota Padat','Kawasan Pinggiran Kota','Zona Industri','Tepi Pantai','Pegunungan','Area Bandara','Area Pelabuhan','Koridor Transportasi'].map(opt).join('')+'</select></div></div></div><div class="card"><div class="cardTitle">'+icon('M4 4h7v7H4zM13 4h7v7h-7zM13 13h7v7h-7zM4 13h7v7H4z')+'Jenis Proyek</div><div class="projectGrid">'+projects.map(function(p){return '<div class="pt '+(S.bt===p[0]?'sel':'')+'" onclick="S.bt=\''+p[0]+'\';S.subtype=(subtypes[S.bt]&&subtypes[S.bt][0])||\'\';saveAuto();render()">'+icon(p[3])+'<b>'+p[1]+'</b><small>'+p[2]+'</small></div>'}).join('')+'</div></div>'+subtypeBlock()+dimsBlock()+durationBlock()}
function subtypeBlock(){if(!subtypes[S.bt])return '';return '<div class="card"><div class="cardTitle">Sub Tipe</div><div class="chips">'+subtypes[S.bt].map(function(x){return '<span class="chip '+(S.subtype===x?'sel':'')+'" onclick="set(\'subtype\',\''+x+'\')">'+x+'</span>'}).join('')+'</div>'+(S.bt==='bridge'||S.bt==='dam'?'<div class="label">Kondisi Perairan</div><div class="chips">'+[['small','Sungai Kecil'],['medium','Sungai Sedang'],['large','Sungai Besar'],['sea','Selat/Laut'],['land','Daratan']].map(function(a){return '<span class="chip '+(S.water===a[0]?'sel':'')+'" onclick="set(\'water\',\''+a[0]+'\')">'+a[1]+'</span>'}).join('')+'</div>':'')+'</div>'}
function dimsBlock(){if(['house','apartment','office','mall','hotel','warehouse','hospital','school','station'].indexOf(S.bt)<0)return '';return '<div class="card"><div class="cardTitle">Dimensi Bangunan</div><div class="label">Jumlah Lantai</div><div class="chips">'+['1 lantai','2 lantai','3 lantai','4 lantai','5 lantai','6-10 lantai','11-20 lantai','20+ lantai'].map(function(x){return '<span class="chip '+(S.floors===x?'sel':'')+'" onclick="set(\'floors\',\''+x+'\')">'+x+'</span>'}).join('')+'</div><div class="label">Bentuk Massa</div><div class="chips">'+['Kotak','Memanjang','L Shape','U Shape','Podium + Tower','Tower'].map(function(x){return '<span class="chip '+(S.massing===x?'sel':'')+'" onclick="set(\'massing\',\''+x+'\')">'+x+'</span>'}).join('')+'</div></div>'}
function durationBlock(){return '<div class="card"><div class="cardTitle">Durasi Video</div><div class="chips">'+durations.map(function(d){return '<span class="chip '+(S.dur===d?'sel':'')+'" onclick="set(\'dur\','+d+')">'+(d===180?'3 mnt':d+'s')+'</span>'}).join('')+'</div><div class="warn ok">Butuh '+(Math.floor(S.dur/8)+1)+' gambar + '+Math.floor(S.dur/8)+' segmen video × 8 detik.</div></div>'}
function stepStyle(){var html='<div class="card"><div class="cardTitle">Gaya Arsitektur</div>';for(var g in styleGroups){html+='<div class="label">'+g+'</div><div class="styleGrid">'+styleGroups[g].map(function(x){return '<div class="style '+(S.style===x?'sel':'')+'" onclick="set(\'style\',\''+x+'\')"><small>'+g+'</small><b>'+x+'</b></div>'}).join('')+'</div>'}return html+'</div><div class="card"><div class="cardTitle">Detail Gaya</div><div class="label">Warna & Material</div><input id="color" value="'+esc(S.color)+'"><div class="label">Ciri Khas</div><input id="feat" value="'+esc(S.feat)+'"><div class="label">Catatan Tambahan</div><textarea id="notes">'+esc(S.notes)+'</textarea></div>'}
function stepCam(){return '<div class="card"><div class="cardTitle">Angle Kamera</div><div class="camGrid">'+cams.map(function(x){return '<div class="cam '+(S.cam===x?'sel':'')+'" onclick="set(\'cam\',\''+x+'\')"><b>'+x+'</b><small>Locked camera</small></div>'}).join('')+'</div></div><div class="card"><div class="cardTitle">Pencahayaan</div><div class="chips">'+lights.map(function(x){return '<span class="chip '+(S.light===x?'sel':'')+'" onclick="set(\'light\',\''+x+'\')">'+x+'</span>'}).join('')+'</div></div><div class="card"><div class="cardTitle">Kecepatan Timelapse</div><div class="chips">'+chip('speedMode','manual','Manual')+chip('speedMode','auto','Auto Bulan')+'</div>'+(S.speedMode==='manual'?'<div class="label">Speed</div><div class="chips">'+['4x','8x','16x','24x','48x'].map(function(x){return '<span class="chip '+(S.speed===x?'sel':'')+'" onclick="set(\'speed\',\''+x+'\')">'+x+'</span>'}).join('')+'</div>':'<div class="label">Durasi Real: <span style="color:var(--accent)">'+S.realM+' bulan</span></div><input type="range" min="1" max="60" value="'+S.realM+'" oninput="S.realM=parseInt(this.value);saveAuto();render()">')+'</div>'}
function stepPhase(){var need=Math.floor(S.dur/8)+1;var status=S.phases.length===need?'warn ok':'warn';return '<div class="card"><div class="cardTitle">Manajemen Fase <span class="chip sel" style="margin-left:auto">'+S.phases.length+'/'+need+'</span></div><div class="chips"><button class="btn primary" onclick="applyRec()">Pakai Rekomendasi</button><button class="btn" onclick="autoExpand()">Auto Expand</button><button class="btn" onclick="phaseModal()">Daftar Fase</button><button class="btn danger" onclick="S.phases=[];saveAuto();render()">Kosongkan</button></div><div class="'+status+'">'+(S.phases.length===need?'Fase sudah pas.':'Jumlah fase harus '+need+' gambar. Gunakan Auto Expand agar pas.')+'</div><div>'+ (S.phases.length?S.phases.map(function(p,i){return '<div class="phaseRow"><span class="phaseNo">'+(i+1)+'</span><span class="phaseName">'+p+'</span><button class="mini" onclick="movePhase('+i+',-1)">↑</button><button class="mini" onclick="movePhase('+i+',1)">↓</button><button class="mini" onclick="delPhase('+i+')">×</button></div>'}).join(''):'<div class="warn">Belum ada fase. Klik Pakai Rekomendasi.</div>')+'</div></div>'}
function stepRef(){return '<div class="card"><div class="cardTitle">Mode Referensi Gambar</div><div class="chips">'+chip('refMode','none','Tanpa Referensi')+chip('refMode','final','Target Akhir')+chip('refMode','both','Progress + Target')+chip('refMode','progress','Progress Saja')+'</div></div>'+uploadBlock('final','Target Akhir Reference')+uploadBlock('progress','Progress Reference')+'<div class="card"><div class="cardTitle">Reverse Final → Early</div><div class="warn">Aktifkan kalau kamu punya gambar final dan ingin tarik mundur proses dari 100% ke 10%.</div><div class="chips">'+chip('reverse',false,'Nonaktif')+chip('reverse',true,'Aktif Reverse')+'</div></div>'}
function uploadBlock(type,title){if((type==='final'&&S.refMode==='progress')||(type==='progress'&&S.refMode==='final')||S.refMode==='none')return '';var data=type==='final'?S.refFinal:S.refProgress;return '<div class="card"><div class="cardTitle">'+title+'</div><div class="upload" onclick="q(\'file_'+type+'\').click()">'+(data?'<img src="'+data+'"><div class="btn danger" onclick="event.stopPropagation();S.ref'+(type==='final'?'Final':'Progress')+'=null;saveAuto();render()">Hapus Gambar</div>':'<svg style="margin:0 auto 8px" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><b>Klik untuk upload</b><br><small style="color:var(--muted)">Gambar disimpan lokal di browser.</small>')+'</div><input id="file_'+type+'" type="file" accept="image/*" style="display:none" onchange="readImg(this,\''+type+'\')"></div>'}
function stepOut(){var ps=genPrompts();var types=[['target','Target Akhir'],['image','Image Fase'],['video','Video Transition'],['all','Semua']];var list=S.out==='all'?ps:ps.filter(function(p){return p.type===S.out});return '<div class="outTabs">'+types.map(function(a){return '<span class="chip '+(S.out===a[0]?'sel':'')+'" onclick="set(\'out\',\''+a[0]+'\')">'+a[1]+'</span>'}).join('')+'</div><div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn primary" onclick="copyAll()">Salin Semua</button><button class="btn" onclick="downloadTxt()">Download TXT</button></div>'+list.map(function(p,i){return '<div class="prompt"><div class="promptHead"><span>'+p.label+'</span><button class="btn" onclick="copyText(`'+p.text.replace(/`/g,'\\`')+'`)">Salin</button></div><div class="promptText">'+esc(p.text)+'</div></div>'}).join('')}
function chip(k,v,label){return '<span class="chip '+(S[k]===v?'sel':'')+'" onclick="set(\''+k+'\','+(typeof v==='string'?'\''+v+'\'':v)+')">'+label+'</span>'}function opt(x){return '<option '+(S.location===x?'selected':'')+'>'+x+'</option>'}
function bindInputs(){['location','color','feat','notes'].forEach(function(id){var e=q(id);if(e)e.oninput=function(){S[id]=id==='location'?e.value:e.value;saveAuto();renderSide()}})}
function recommended(){var base=(phaseMap[S.bt]||phaseMap.house).slice();return fit(base,Math.floor(S.dur/8)+1)}function fit(arr,n){if(arr.length===n)return arr.slice();if(arr.length<n){var r=arr.slice();while(r.length<n)r.splice(Math.max(1,r.length-1),0,r[Math.max(0,r.length-2)]+' Lanjutan');return r}var out=[arr[0]],mid=arr.slice(1,-1),need=n-2;for(var i=0;i<need;i++){out.push(mid[Math.round(i*(mid.length-1)/Math.max(1,need-1))])}out.push(arr[arr.length-1]);return out}function applyRec(){S.phases=recommended();saveAuto();render();toast('Fase rekomendasi diterapkan')}function autoExpand(){applyRec()}function movePhase(i,d){var j=i+d;if(j<0||j>=S.phases.length)return;var t=S.phases[i];S.phases[i]=S.phases[j];S.phases[j]=t;saveAuto();render()}function delPhase(i){S.phases.splice(i,1);saveAuto();render()}
function phaseModal(){var all=[];for(var k in phaseMap){phaseMap[k].forEach(function(p){if(all.indexOf(p)<0)all.push(p)})}q('modalRoot').innerHTML='<div class="modal" onclick="closeModal()"><div class="modalBox" onclick="event.stopPropagation()"><div class="modalHead"><b>Daftar Fase</b><button class="btn" onclick="closeModal()">×</button></div><div class="modalBody">'+all.map(function(p){return '<div class="phasePick" onclick="S.phases.push(\''+p.replace(/'/g,'')+'\');saveAuto();render();closeModal();toast(\'Fase ditambahkan\')">+ '+p+'</div>'}).join('')+'</div></div></div>'}function countryModal(){q('modalRoot').innerHTML='<div class="modal" onclick="closeModal()"><div class="modalBox" onclick="event.stopPropagation()"><div class="modalHead"><b>Pilih Negara</b><button class="btn" onclick="closeModal()">×</button></div><div class="modalBody"><input id="csearch" placeholder="Cari negara..." oninput="filterCountry(this.value)"><div id="clist" style="margin-top:10px"></div></div></div></div>';filterCountry('')}function filterCountry(s){var f=countries.filter(function(c){return c.toLowerCase().indexOf(String(s).toLowerCase())>-1});q('clist').innerHTML=f.map(function(c){return '<div class="countryItem" onclick="S.country=\''+c+'\';saveAuto();closeModal();render()">'+c+'</div>'}).join('')}function closeModal(){q('modalRoot').innerHTML=''}
function readImg(inp,type){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){if(type==='final')S.refFinal=e.target.result;else S.refProgress=e.target.result;saveAuto();render()};r.readAsDataURL(f)}
function ctx(){return 'Project: '+nameOf(S.bt)+(subtypeOf()?' ('+subtypeOf()+')':'')+'\nCountry: '+S.country+'\nEnvironment: '+S.location+'\nStyle: '+S.style+'\nMaterials: '+S.color+'\nFeatures: '+S.feat+'\nCamera: '+S.cam+' -- LOCKED, same framing, same lens, no zoom, no pan, no rotation.\nLighting: '+S.light+'\nFloor / massing lock: '+S.floors+', '+S.massing+'\nReference mode: '+S.refMode+'\n'}
function phaseDetail(p,i,total){var pct=Math.round(i/Math.max(1,total-1)*100);var forbid='wrong project type, changed camera, changed location, text, watermark, completed elements too early';if(S.bt==='bridge')forbid+=', abutment in middle of river, missing both riverbanks';if(S.bt==='rail')forbid+=', road pavement, airport runway';if(S.bt==='road')forbid+=', rail track, building tower';var show='Show '+p+' as the completed end state of this phase. Progress '+pct+'%. Active workers and construction equipment only if logical for this stage.';if(p.toLowerCase().indexOf('survei')>-1)show='Raw site with survey stakes, total station, laser/grid marking. No excavation yet.';if(p.toLowerCase().indexOf('galian')>-1)show='Open excavation, excavator, soil piles, clean footprint. No concrete yet.';if(p.toLowerCase().indexOf('pembesian')>-1)show='Dense rebar cage/grid installed, workers tying steel. No concrete poured yet.';if(p.toLowerCase().indexOf('cor')>-1)show='Concrete pour in progress, pump truck, wet concrete, workers with vibrators.';if(p.toLowerCase().indexOf('girder')>-1)show='Crane lifting bridge girders, piers/abutments visible, river below, no deck concrete yet.';if(p.toLowerCase().indexOf('aspal')>-1||p.toLowerCase().indexOf('marka')>-1)show='Fresh pavement and road marking work, rollers/paving machine, not fully open until final.';return {pct:pct,show:show,forbid:forbid}}
function imgPrompt(p,i,total){var d=phaseDetail(p,i,total);return '[IMAGE PROMPT '+(i+1)+'/'+total+'] -- '+p.toUpperCase()+'\n\nVERTICAL 9:16, SINGLE SCENE, photorealistic construction documentation.\n\n'+ctx()+'\nCONTINUITY LOCK:\nPreserve exact same project identity, final target design, footprint, massing, height, road/canal/river/environment, camera angle, framing, lens, distance, and lighting across every frame.\n\nPHASE END STATE:\n'+d.show+'\n\nSTAGE GATE: '+d.pct+'% complete. Do not jump to later phases.\n\nMUST SHOW:\n'+d.show+'\n\nFORBIDDEN:\n'+d.forbid+'\n\nNEGATIVE:\ntext, caption, watermark, logo, UI, collage, split screen, redesign, wrong scale, wrong phase.'}
function videoPrompt(a,b,i,total){return '[VIDEO PROMPT '+i+'/'+total+'] -- '+a.toUpperCase()+' -> '+b.toUpperCase()+'\n\nVERTICAL 9:16, duration 8 seconds.\n\nSTART FRAME: end state of '+a+'.\nEND FRAME: end state of '+b+'.\n\n'+ctx()+'\nACTION:\nShow realistic construction timelapse only between these two phases. Materials appear progressively, workers/equipment move naturally, no chaotic flicker. Final frame must match the next image prompt exactly.\n\nCAMERA LOCK:\nCompletely static camera. No pan, no tilt, no zoom, no shake, no drone movement.\n\nPACING:\n'+(S.speedMode==='auto'?'Represent '+S.realM+' months compressed naturally into 8 seconds.':'Use '+S.speed+' construction timelapse pacing, but do not show speed text on screen.')+'\n\nNEGATIVE:\ntext, numbers, speed label, watermark, captions, UI overlay, redesign, wrong location, wrong phase, camera movement.'}
function genPrompts(){var ph=S.phases.length?S.phases:recommended();var out=[];out.push({type:'target',label:'[TARGET AKHIR] '+nameOf(S.bt),text:'[TARGET AKHIR PROMPT]\n\nVERTICAL 9:16. Fully completed '+nameOf(S.bt)+(subtypeOf()?' ('+subtypeOf()+')':'')+'.\n\n'+ctx()+'\nTARGET DESIGN LOCK:\nFinished, clean, operational, with completed facade/envelope/siteworks/landscaping. This image becomes the design anchor for all construction phases.\n\nNEGATIVE:\nconstruction equipment, scaffolding, unfinished structure, text, watermark, wrong project type.'});for(var i=0;i<ph.length;i++)out.push({type:'image',label:'[IMAGE '+(i+1)+'/'+ph.length+'] '+ph[i],text:imgPrompt(ph[i],i,ph.length)});for(var v=0;v<ph.length-1;v++)out.push({type:'video',label:'[VIDEO '+(v+1)+'/'+(ph.length-1)+'] '+ph[v]+' → '+ph[v+1],text:videoPrompt(ph[v],ph[v+1],v+1,ph.length-1)});if(S.reverse){var rev=[100,90,75,60,45,30,20,10];rev.forEach(function(pct,idx){out.push({type:'image',label:'[REVERSE IMAGE] '+pct+'%',text:'ULTRA STRICT REVERSE CONSTRUCTION LOCK -- '+pct+'% STAGE\n\nUse the final reference as design anchor. Preserve exact same camera, site, footprint, massing, roof target, facade rhythm, canal/road/neighborhood/environment. Only roll construction backward to '+pct+'%. Do not redesign. Do not mix later-stage elements. No text, no watermark.'})})}return out}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t);else{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Prompt disalin')}function copyAll(){copyText(genPrompts().map(function(p){return p.label+'\n\n'+p.text}).join('\n\n============================================================\n\n'))}function downloadTxt(){var txt=genPrompts().map(function(p){return p.label+'\n\n'+p.text}).join('\n\n============================================================\n\n');var b=new Blob([txt],{type:'text/plain;charset=utf-8'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='flow-builder-prompts.txt';a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000);toast('TXT didownload')}
function saveProject(){try{var arr=JSON.parse(localStorage.getItem('flowbuilder_projects')||'[]');arr.unshift({date:new Date().toLocaleString('id-ID'),state:JSON.stringify(S),name:nameOf(S.bt)+' - '+S.country});localStorage.setItem('flowbuilder_projects',JSON.stringify(arr.slice(0,20)));toast('Project disimpan')}catch(e){toast('Gagal save','warn')}}function resetProject(){localStorage.removeItem('flowbuilder_v14_download');location.reload()}function renderSide(){var need=Math.floor(S.dur/8)+1;q('side').innerHTML=[['Mode',S.mode],['Negara',S.country],['Lokasi',S.location],['Proyek',nameOf(S.bt)],['Sub Tipe',subtypeOf()||'-'],['Durasi',S.dur+'s = '+need+' gambar'],['Gaya',S.style||'-'],['Kamera',S.cam],['Cahaya',S.light],['Fase',S.phases.length+'/'+need]].map(function(r){return '<div class="sbRow"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>'}).join('')}window.onload=function(){loadAuto();render()}
</script>
</body>
</html>
